# CTC Decoding Configuration
# Pure-Python TorchAudio + KenLM pipeline configuration

# Model artifacts paths
artifacts:
  tokens_txt: artifacts/tokens.txt
  lexicon_txt: artifacts/lexicon.csv
  
# Language model configuration  
language_model:
  # NVIDIA TAO speech-to-text models (recommended)
  nvidia_tao:
    model_dir: models/language_models/nvidia_tao_v4.1
    # Available models in the TAO package:
    arpa_4gram: models/language_models/nvidia_tao_v4.1/4gram-pruned-0_2_7_9-en-lm-set-1.0.arpa
    binary_4gram: models/language_models/nvidia_tao_v4.1/4gram-pruned-0_2_7_9-en-lm-set-1.0.bin
    arpa_mixed: models/language_models/nvidia_tao_v4.1/mixed_lm-lower.arpa  # Large 5-gram
    binary_mixed: models/language_models/nvidia_tao_v4.1/mixed-lower.binary
    arpa_3gram: models/language_models/nvidia_tao_v4.1/3-gram.pruned.3e-7.arpa
    vocab_file: models/language_models/nvidia_tao_v4.1/en_4.0_dict_vocab.txt
    lexicon_file: models/language_models/nvidia_tao_v4.1/lexicon.txt  # Pre-built lexicon
  
  # Currently active model (change this to switch models)
  active_model: models/language_models/nvidia_tao_v4.1/4gram-pruned-0_2_7_9-en-lm-set-1.0.bin

# CTC Decoder configuration
decoder:
  # Decoder backend preference (auto, flashlight, greedy)
  backend: "flashlight"
  
  # Token definitions (matching evaluate_model_helpers.py)
  blank_token: "BLANK"
  silence_token: "SIL" 
  unk_word: "<unk>"

# Flashlight decoder parameters (optimized from focused parameter search)
flashlight:
  lm_weight: 4.5       # Optimal LM weight confirmed by search
  word_score: -0.7     # Stronger word penalty - best result from search
  beam_size: 100       # Optimal beam size - larger isn't better
  beam_size_token: 25  # Token-level beam size
  beam_threshold: 24.0  # Pruning threshold
  nbest: 100           # number of n-best hypotheses
  sil_score: -0.275      # Silence token penalty/bonus
  log_add: false       # Use simple log addition (faster)
  smearing_mode: "max" # Trie smearing mode: "max", "logadd", or "none"

# Lexicon building configuration
lexicon:
  # CMUdict settings
  cmudict_url: "https://raw.githubusercontent.com/cmusphinx/cmudict/master/cmudict.dict"
  cmudict_cache: decoding/artifacts/cmudict.dict
  
  # Vocabulary settings
  lm_vocab_size: 60000           # Number of top words to extract from LM
  
  # Phone mapping (ARPAbet to 39-phone set)
  strip_stress: true             # Remove stress digits (AH0 -> AH)
  map_allophones: true           # Map allophones (AX -> AH, IX -> IH, etc.)

# Text normalization for submission
submission:
  lowercase: true       # Convert to lowercase
  strip_punct: true     # Remove punctuation  
  collapse_space: true  # Collapse multiple spaces to single space

# Hyperparameter tuning grid
tuning:
  # Grid search settings
  num_samples: 30  # Number of test samples per parameter combination
  output_dir: "grid_search_results"
  primary_metric: "WER"  # Primary optimization metric
  
  # Save intermediate results
  save_nbest: true
  save_detailed_results: true
  
  # Parameter grids by decoder type
  flashlight: # Best WER on 500 samples: 0.032
    # Fine-tune around optimal lm_weight=2.25 +
    lm_weight: [4.0, 4.5, 5.0]  # Narrow range around best: 2.6 beat 2.5, can we go higher?
    
    # Fine-tune around optimal word_score= -0.7
    # word_score: [-0.75, -0.7, -0.65]  # Narrow range around best: -0.7 WINS!!!
    
    # Fine-tune around optimal beam_threshold=22.0
    # beam_threshold: [23.0, 25.0]  # Narrow range around best: 22.0 WINS!!!
    
    # Tune silence score (can significantly impact word boundaries)
    # sil_score: [-0.325, -0.3, -0.275]  # Best found: -0.275
  
  greedy:
    # Greedy decoder has no tunable parameters, but we can add some if needed
    # For example, if we add temperature scaling or other post-processing
    
  # Future decoder types can be added here
  # transformer:
  #   num_layers: [6, 8, 12]
  #   hidden_size: [256, 512, 768]

# Logging and output
logging:
  level: INFO
  save_logs: true
  log_dir: logs/decoding

# W&B integration for tuning
wandb:
  project: "nejm-brain-to-text-decoding"
  entity: null  # Set to your W&B username
  tags: ["ctc", "decoding", "tuning"]
