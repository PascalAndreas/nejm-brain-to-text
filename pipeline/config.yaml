# Brain-to-Text Pipeline Configuration
# This configuration defines the complete pipeline from neural data to text

# Dataset configuration
dataset:
  data_root: data/t15_copyTask_neuralData
  batch_size: 32
  num_workers: 8
  pin_memory: true
  
  # Data splits to use
  splits: [train, val, test]
  
  # Optional corpus filtering
  corpus_filter: null  # e.g., ['50-Word', 'Switchboard']
  
  # Bad trials to exclude
  bad_trials_dict: null
  
  # Random seed for reproducibility
  random_seed: 42

# Model configuration
model:
  name: gru_v1  # Model identifier from registry
  
  # Model parameters
  params:
    input_dim: 512
    vocab_size: 41
    num_days: 20
    hidden_size: 768
    num_layers: 5
    dropout: 0.2
    blank_idx: 0
    
    # Smoother configuration (separate from PreNet)
    smoother_config:
      type: depthwise  # 'gaussian', 'depthwise', 'ema', or 'identity'
      kernel_size: 11  # Kernel size for convolution-based smoothers
      residual_gate: true  # Gated residual connection
      init_std: 2.0  # Standard deviation for initialization
    
    # PreNet configuration (no longer includes smoother)
    prenet_config:
      # Day-specific adaptation (FiLM)
      day_adapter_config:
        grouping: blocks8  # 'full', 'blocks8', or integer
        identity_init: true
        l2_tether: 0.0001
        l1_reg: 0.0
      
      # Patching configuration
      patch_config:
        size: 4  # Concatenate 4 frames
        stride: 2  # Stride of 2 frames
      
      # Activation function
      activation: softsign
    
    # Auxiliary layer for deep supervision (None to disable)
    aux_layer: 3  # Attach to layer 3 of 5
    
    # Temperature calibration settings
    temperature: 1.0  # Initial temperature for calibration (1.0 = no scaling)

# Training configuration
training:
  # Optimizer settings
  optimizer:
    lr: 0.0003
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 0.00000001
  
  # Learning rate scheduler
  scheduler:
    type: warmup_cosine  # 'cosine', 'warmup_cosine', 'onecycle', etc.
    warmup_steps: 5000
    T_max: 100000
    min_lr: 0.000001
  
  # Auxiliary CTC loss configuration (deep supervision)
  aux_loss:
    enabled: true  # Enable auxiliary loss
    weight: 0.25  # Base weight for auxiliary loss
    type: warmup_hold_decay  # Warmup, hold, then decay pattern
    warmup_fraction: 0.05  # Ramp up over first 5% of training
    hold_fraction: 0.75    # Hold at full weight for 75% of training
    decay_fraction: 0.20   # Decay over last 20% of training
  
  # FiLM regularization scheduling
  film_reg:
    weight: 1.0  # Base weight for FiLM regularization (multiplies DayAdapter's l2/l1)
    type: warmup_decay  # Warmup then decay pattern
    warmup_fraction: 0.05  # Warmup from 0 over first 5% of training
    decay_fraction: 0.15   # Cosine decay over next 15% of training
    max_fraction_of_supervised: 0.05  # Limit reg to 5% of supervised loss
  
  # Training settings
  max_epochs: 100
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 1000
  log_every_n_steps: 100
  
  # Mixed precision training
  precision: 16  # Use 16-bit precision for faster training
  
  # EMA configuration with bias correction
  use_ema: true
  ema_decay: 0.999
  ema_bias_correction: true  # Use bias-corrected EMA
  ema_warmup_steps: 10  # Warmup steps for bias correction
  
  # Data augmentation
  augmentation:
    time_mask:
      enabled: true
      num_masks: 2
      mask_width: 40
    
    channel_mask:
      enabled: true
      mask_prob: 0.1
    
    channel_dropout:
      enabled: true
      dropout_prob: 0.05
    
    noise_injection:
      enabled: false
      noise_std: 0.01

# Decoding configuration
decoding:
  # Decoder implementation
  impl: flashlight_ctc
  
  # Token and lexicon files
  tokens: language_models/flashlight_decoder_vocab.txt
  lexicon: language_models/lexicon.txt
  
  # Language model
  kenlm: language_models/mixed-lower.binary
  
  # Decoder hyperparameters (to be tuned)
  lm_weight: 2.5
  word_score: -0.2
  sil_score: 0.0
  beam_size: 100
  beam_size_token: 10
  beam_threshold: 20.0
  
  # N-best list size for potential rescoring
  nbest: 50
  
  # Greedy decoding for quick validation
  use_greedy_for_val: true

# Temperature calibration configuration
calibration:
  enabled: true  # Enable post-training temperature calibration
  
  # Calibration settings
  epochs: 50  # Number of calibration epochs
  lr: 0.01  # Learning rate for temperature optimization
  
  # Calibration method
  classwise_temp: false  # If true, use per-class temperature scaling
  
  # Device settings (auto-detect from model if not specified)
  device: auto

# Emission caching configuration
emission_cache:
  cache_dir: cache/emissions
  format: npz  # 'npz', 'pt', or 'hdf5'
  compress: true

# Checkpoint configuration
checkpointing:
  save_dir: models/checkpoints
  save_top_k: 3
  monitor: val/per  # Phoneme error rate
  mode: min
  save_last: true
  
# Logging configuration
logging:
  logger: wandb  # Using Weights & Biases for experiment tracking
  project: brain-to-text
  name: gru_ctc_baseline
  save_dir: logs
  log_model: false  # Log model artifacts to wandb
  
# Hardware configuration
hardware:
  accelerator: auto  # 'auto', 'gpu', 'mps', or 'cpu'
  devices: 1  # Number of GPUs/devices
  strategy: auto  # 'auto', 'ddp', 'dp', etc.
  
# Experiment tracking
experiment:
  seed: 42
  deterministic: true
  benchmark: false  # CUDNN benchmark
  
  # Tags for experiment tracking
  tags:
    - baseline
    - gru
    - ctc
    - film
    - ema
  
  # Notes
  notes: |
    Refactored GRU-CTC model with modular architecture and optimizations:
    - Separate smoother module (depthwise, k=11, residual gate)
    - FiLM day adaptation with delta parameterization and L2 tethering
    - Patching (size=4, stride=2) for length reduction
    - 5-layer GRU with 768 hidden units and optimal mixed packing strategy
    - Auxiliary CTC at layer 3 with warmup-decay scheduling
    - Main CTC head with integrated temperature scaling and proper masking
    - Fixed-decay EMA with adaptive update schedule for stability
    - Post-training temperature calibration on validation set
    - Consolidated CTC target flattening across all components
    - Weights & Biases logging for experiment tracking
